<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{name}} — CV</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#15181C; --ink-2:#4F5763; --ink-3:#8B93A0; --rule:#D6DAE0; --brand:#E25544; --brand-bg:#FBE6E3; }
    @page { size: A4; margin: 14mm 16mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-family: 'Manrope', system-ui, sans-serif; font-size: 10.5pt; line-height: 1.45; color: var(--ink); background: #fff; }
    a { color: inherit; text-decoration: none; }
    .sheet { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
    @media print { .sheet { max-width: none; padding: 0; } }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
    h1 { font-size: 24pt; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .role { font-size: 12pt; font-weight: 600; color: var(--brand); margin-top: 6px; }
    .city { color: var(--ink-2); margin-top: 4px; }
    .links { text-align: right; font-size: 9.5pt; color: var(--ink-2); line-height: 1.6; }
    .links b { display: block; color: var(--ink); font-weight: 600; }
    h2 { font-size: 9pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
    .about p + p { margin-top: 6px; }
    .xp { display: grid; grid-template-columns: 78px 1fr; gap: 4px 16px; margin-bottom: 10px; break-inside: avoid; }
    .xp .when { font-family: 'JetBrains Mono', monospace; font-size: 9pt; color: var(--ink-2); padding-top: 2px; }
    .xp h3 { font-size: 11pt; font-weight: 700; }
    .xp .co { color: var(--brand); font-weight: 600; font-size: 10pt; }
    .xp p { margin-top: 3px; color: var(--ink-2); }
    .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 8.5pt; padding: 1px 7px; border: 1px solid var(--rule); border-radius: 99px; color: var(--ink-2); }
    .tag.k { background: var(--brand-bg); border-color: transparent; color: var(--brand); }
    .skills { display: grid; grid-template-columns: 110px 1fr; gap: 4px 16px; }
    .skills dt { font-weight: 600; }
    .skills dd { color: var(--ink-2); }
    .skills dd b { color: var(--ink); font-weight: 600; }
    .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
    .proj { break-inside: avoid; }
    .proj b { font-weight: 700; }
    .proj span { font-family: 'JetBrains Mono', monospace; font-size: 8.5pt; color: var(--ink-3); margin-left: 6px; }
    .proj p { color: var(--ink-2); font-size: 9.5pt; }
    .foot { margin-top: 20px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 8.5pt; color: var(--ink-3); display: flex; justify-content: space-between; gap: 16px; }
  </style>
</head>
<body>
<div class="sheet">
  <header class="top">
    <div>
      <h1>{{name}}</h1>
      <div class="role">{{role}}</div>
      <div class="city">{{city}}</div>
    </div>
    <div class="links">
      {{cv_links}}
    </div>
  </header>

  <section class="about">
    <h2>{{role}}</h2>
    {{about_paragraphs}}
  </section>

  <h2>{{cv_experience}}</h2>
  {{cv_experience_items}}

  <h2>{{cv_education}}</h2>
  {{cv_education_items}}

  <h2>{{cv_skills}}</h2>
  <dl class="skills">
    {{cv_skill_rows}}
  </dl>

  <h2>{{cv_projects}}</h2>
  <div class="projects">
    {{cv_project_items}}
  </div>

  <footer class="foot">
    <span>{{cv_generated}} {{site}}</span>
    <span>{{stat_line}}</span>
  </footer>
</div>
</body>
</html>
