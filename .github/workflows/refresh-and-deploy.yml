name: Refresh data, build and deploy

# Runs every night, on every push to main, and by hand.
# 1. pulls the LeetCode calendar and the GitHub contribution calendar into src/data/
# 2. builds src/ from content/ and templates/ (pages, notes, sitemap, CV as HTML and PDF)
# 3. commits the data and the built pages when something changed
# 4. publishes src/ to the gh-pages branch, which GitHub Pages serves

on:
  schedule:
    - cron: "17 3 * * *"      # 03:17 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch LeetCode calendar
        run: python scripts/fetch-leetcode.py || echo "::warning::LeetCode fetch failed, keeping the previous data"

      - name: Fetch GitHub calendar and stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch-github.py || echo "::warning::GitHub fetch failed, keeping the previous data"

      - name: Build pages and CV
        run: python scripts/build.py

      - name: Commit refreshed data and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          # the "fetched" date changes every run; only commit when something else did
          if git diff --cached -I '"fetched"' --quiet; then
            echo "no change"
          else
            git commit -m "build: refresh data and pages"
            git push
          fi

      - name: Publish src/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          publish_branch: gh-pages
          force_orphan: true
